version: '3.8'

services:
  laravel-app:
    command: ["sh", "-c", "php artisan serve --host=0.0.0.0 --port=8080"]
    image: api-filmes-laravel-app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    ports:
      - "8080:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      - laravel-mysql
    networks:
      - laravel-network
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_KEY: base64:YOUR_APP_KEY
      DB_CONNECTION: mysql
      DB_HOST: laravel-mysql
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: yuri
      DB_PASSWORD: yuri1520

  laravel-mysql:
    image: mysql:8.0
    container_name: laravel-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: yuri
      MYSQL_PASSWORD: yuri1520
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - laravel-network

volumes:
  mysql-data:

networks:
  laravel-network:
    driver: bridge
